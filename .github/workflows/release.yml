name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X github.com/AhmedAburady/rcm-go/internal/cmd.Version=$VERSION -X github.com/AhmedAburady/rcm-go/internal/cmd.Commit=$COMMIT -X github.com/AhmedAburady/rcm-go/internal/cmd.BuildDate=$BUILD_DATE"

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o rcm-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o rcm-linux-arm64 .

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o rcm-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o rcm-darwin-arm64 .

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o rcm-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o rcm-windows-arm64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rcm-linux-amd64
            rcm-linux-arm64
            rcm-darwin-amd64
            rcm-darwin-arm64
            rcm-windows-amd64.exe
            rcm-windows-arm64.exe
          generate_release_notes: true
